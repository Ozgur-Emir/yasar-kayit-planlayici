<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayıt Planlayıcı · Yaşar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f4f5f5;--card:#fff;--tx:#1e2a38;--mu:#5c6f82;--ac:#1e2a38;--gold:#c9a86a;--nav:#1e2a38;--bd:#e7e9ea;--bad:#b3261e;--ok:#167649}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.app>div{background:#fff}
.nav{background:var(--nav);color:#dbe6f3;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.brand b{display:block;font-size:16px;color:#fff}.brand small{color:var(--gold)}
#menu{display:flex;flex-direction:column;gap:2px}
.m{text-align:left;background:none;border:0;color:#cfdcec;padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer}
.m.on,.m:hover{background:#323d4a;color:#fff}.m.on{box-shadow:inset 3px 0 var(--gold)}
.note{font-size:12px;color:#8fa6c0;margin-top:auto}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--nav);color:#fff;border-bottom:2px solid var(--gold)}
.chip{background:#323d4a;border-radius:6px;padding:2px 8px;font-size:12px}
main{padding:20px;max-width:1100px}
.brand{display:flex;gap:10px;align-items:center}.brand img{width:54px;height:54px;border-radius:50%;background:#fff}.brand b{font-size:15px}
.row2{display:flex;gap:14px;align-items:center}.lang{display:flex;gap:4px}
.lang button{background:transparent;color:#cfdcec;border:1px solid #4a5666;padding:3px 10px;font-size:12px}.lang button.on{background:var(--gold);color:#1e2a38;border-color:var(--gold)}
.who{text-align:right;line-height:1.3}.who small{display:block;color:#a9b8c9;font-size:12px;font-weight:400}
h1{font-size:24px;margin:0 0 12px}h2{font-size:17px;margin:20px 0 8px}h3{font-size:12px;margin:0 0 6px;color:var(--mu);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:linear-gradient(90deg,#d5d8fb,#f3dec5) top/100% 3px no-repeat,var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 14px 14px;box-shadow:0 2px 8px #1e2a3814}
.big{font-size:30px;font-weight:600}.big small{font-size:15px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.tag{background:#f5e3a8;color:#5a4300;border-radius:4px;padding:1px 8px;font-size:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;font:inherit;color:var(--tx);cursor:pointer}
.tile b{display:block}.tile span{color:var(--mu);font-size:13px}
.banner{background:#167649;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:12px}
.strip{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.sticky{position:sticky;top:12px}
.course{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.course.on{border-left:3px solid var(--gold)}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:12px/1.3 inherit;cursor:pointer;text-align:left}
.sec.sel{background:var(--ac);color:var(--card);border-color:var(--ac)}
.sec:disabled{opacity:.45;cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 4px,var(--bd) 4px,var(--bd) 8px)}
table{border-collapse:collapse;width:100%}
.tt{font-size:11px;table-layout:fixed}.tt td,.tt th{border:1px solid var(--bd);height:19px;padding:0 2px;text-align:center;overflow:hidden;white-space:nowrap;color:#fff}
.tt th{background:var(--bg);color:var(--tx);font-weight:600}
.lt{font-size:13px;margin:8px 0}.lt th,.lt td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
button{font:inherit;font-weight:600;background:var(--ac);color:var(--card);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea,input:not([type=checkbox]):not([type=file]){font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
textarea{width:100%;height:150px;font:12px/1.45 ui-monospace,monospace}
label{display:block}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mu{color:var(--mu)}.small{font-size:12px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal[hidden]{display:none}
.box{background:var(--card);border-radius:10px;padding:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:800px){.app{grid-template-columns:1fr}#menu{flex-direction:row;flex-wrap:wrap}.note{display:none}.two{grid-template-columns:1fr}}
@media print{.nav,header,button,.strip{display:none}.app{display:block}}
</style>
</head>

const D=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'],COL=['#2f6fd0','#d9650a','#1b7a43','#8e44c9','#c0392b','#007b83','#8a6500','#b0357a'],$=i=>document.getElementById(i);
const tm=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const fm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');

let C={};
function parse(){C={};S.csv.split('\n').forEach(l=>{const f=l.split(';').map(x=>x.trim());if(f.length<6||!f[0]||isNaN(+f[2]))return;
const slots=f[5].split('|').filter(Boolean).map(z=>{const m=z.trim().match(/^(\S+)\s+(\d+:\d+)-(\d+:\d+)$/);return m&&D.includes(m[1])?{d:D.indexOf(m[1]),s:tm(m[2]),e:tm(m[3])}:null}).filter(Boolean);
const c=C[f[0]]=C[f[0]]||{kod:f[0],ad:f[1],akts:+f[2],tur:f[3].toUpperCase(),pre:(f[6]||'').split('+').filter(Boolean),sec:[]};c.sec.push({n:f[4],slots})})}

function reset(){parse();S.want=new Set();S.pick={};avail().forEach(c=>{if(!miss(c).length&&(c.tur==='Z'||F().has(c.kod)))S.want.add(c.kod)})}
const chosen=()=>[...S.want].map(k=>C[k]),tot=()=>chosen().reduce((a,c)=>a+c.akts,0);
const picked=()=>chosen().map(c=>({c,s:c.sec.find(x=>x.n===S.pick[c.kod])})).filter(x=>x.s);

function grid(p){let h='<table class="tt"><tr><th></th>'+D.map((d,i)=>`<th>${dn(i)}</th>`).join('')+'</tr>';
for(let hr=8;hr<22;hr++){h+=`<tr><th>${hr}</th>`;for(let d=0;d<7;d++){const i=p.findIndex(({s})=>s.slots.some(z=>z.d===d&&z.s<(hr+1)*60&&z.e>hr*60));
h+=i<0?'<td></td>':`<td style="background:${COL[i%8]}">${esc(p[i].c.kod)}</td>`}h+='</tr>'}return h+'</table>'}
function solve(L0){const L=[...L0].sort((a,b)=>a.sec.length-b.sec.length),res=[],cur=[];
(function rec(i){if(res.length>=3000)return;if(i===L.length){res.push(cur.slice());return}
for(const s of L[i].sec){if(cur.some(t=>clash(t.s,s)))continue;cur.push({c:L[i],s});rec(i+1);cur.pop()}})(0);return res}
function score(p){const by=D.map(()=>[]);let early=0,gaps=0,nd=0;
p.forEach(({s})=>s.slots.forEach(z=>{by[z.d].push(z);if(z.s<640)early++}));
by.forEach(a=>{if(!a.length)return;nd++;a.sort((x,y)=>x.s-y.s);for(let i=1;i<a.length;i++)gaps+=Math.max(0,a[i].s-a[i-1].e)});

ied and clashing ones are removed.", "Az gün": "Fewer days", "Az boşluk": "Fewer gaps", "10:40’tan önce ders olmasın": "No classes before 10:40", "Hesapla": "Calculate", "Çakışmasız program yok.": "No clash-free timetable.", "Her şube kombinasyonunda çakışanlar: ": "Clashing in every section combination: ", ". Birini bırakmayı düşün.": ". Consider dropping one of them.", " ve ": " and ", "Çakışma üç veya daha fazla dersin birleşiminden geliyor; bir dersi çıkarıp tekrar dene.": "The clash comes from three or more courses together; remove one course and try again.", "3000’den fazla": "More than 3000", " çakışmasız program bulundu. En iyi üçü:": " clash-free timetables found. Best three:", "Bu planı uygula": "Apply this plan", "Göndermeden önce kontrol": "Pre-submission check", "En az bir ders seçili": "At least one course selected", "Her seçili ders için şube seçildi": "A section is chosen for every selected course", " (eksik: ": " (missing: ", "Ders saatleri çakışmıyor": "No timetable clashes", "AKTS sınırı: ": "ECTS limit: ", "Önkoşullar sağlanıyor": "Prerequisites are met", "Kalınan dersler listede": "Failed courses are in the list", "Her şey tamam.": "Everything is fine.", " Şimdi gerçek kaydı OBS’de yap.": " Now do the real registration in OBS.", "Kırmızı maddeleri düzelt.": "Fix the items in red.", "Bu araç hiçbir şey göndermez. Kurallar senin girdiğin değerlere göre çalışır.": "This tool sends nothing. The rules use the values you entered.", "AKTS": "ECTS"},KS=Object.keys(EN).sort((a,b)=>b.length-a.length);
const tr=h=>S.lang==='en'?KS.reduce((s,k)=>s.split(k).join(EN[k]),h):h;
const DE=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],dn=d=>S.lang==='en'?DE[d]:D[d];
function home(){const t=tot(),f=[...F()].filter(k=>C[k]);
return `<h1>Hoş geldin, Demo</h1><p class="mu">2026-2027 Güz ders kaydı için planlama aracı.</p>${f.length?`<div class="banner">Bu dönem tekrar etmen gereken ders var: ${esc(f.join(', '))}. Listeye otomatik eklendi.</div>`:''}
<div class="cards"><div class="card"><h3>Öğrenci</h3><b>Demo Öğrenci</b><p class="mu">Enerji Sistemleri Mühendisliği<br>4. sınıf · kurgusal profil</p></div>
<div class="card"><h3>AGNO ve AKTS sınırı</h3><div class="big">${S.gno}</div><p class="mu">Bu dönem en fazla ${lim()} AKTS</p></div>
<div class="card"><h3>Başarılan AKTS</h3><div class="big">${S.ap} <small>/ ${S.at}</small></div><div class="bar"><i style="width:${Math.min(100,S.ap/S.at*100)}%"></i></div></div>
<div class="card"><h3>Kayıt durumu</h3><span class="tag">Taslak</span><p class="mu">${S.want.size} ders · ${t}/${lim()} AKTS · ${picked().length} şube belirlendi</p></div></div>
<h2>Hızlı erişim</h2><div class="cards"><button class="tile" data-go="reg"><b>Ders Kayıt</b><span>Şube seç, çakışmaları gör</span></button><button class="tile" data-go="prog"><b>Haftalık Program</b><span>Planını tablo olarak gör</span></button><button class="tile" data-go="stat"><b>Durumum</b><span>Geçilen ve kalınan dersler</span></button></div>`}

function reg(){const t=tot(),l=lim(),pk=picked();
const rows=avail().map(c=>{const m=miss(c),on=S.want.has(c.kod),cur=S.pick[c.kod];
const al=cur?c.sec.filter(x=>x.n!==cur&&!pk.some(o=>o.c!==c&&clash(o.s,x))).map(x=>x.n):[];
return `<div class="course ${on?'on':''}"><label><input type="checkbox" data-c="${esc(c.kod)}" ${on?'checked':''} ${m.length?'disabled':''}> <b>${esc(c.kod)}</b> ${esc(c.ad)} <span class="mu">· ${c.akts} AKTS · ${c.tur==='Z'?'zorunlu':'seçmeli'}${F().has(c.kod)?' · <b class="bad">tekrar</b>':''}</span></label>`
+(m.length?`<div class="bad small">Önkoşul eksik: ${esc(m.join(', '))}</div>`:'')
+(on?`<div class="secs">${c.sec.map(s=>{const o=pk.find(x=>x.c!==c&&clash(x.s,s)),sel=cur===s.n,lock=o&&!sel;
return `<button class="sec ${sel?'sel':''}" data-c="${esc(c.kod)}" data-s="${esc(s.n)}" ${lock?'disabled':''}>Şube ${esc(s.n)} · ${lbl(s)}${lock?' · '+esc(o.c.kod)+' ile çakışır':''}</button>`}).join('')}</div>`
+(cur?`<div class="mu small">Şube dolarsa yedek: ${al.length?esc(al.join(', ')):'yok'}</div>`:''):'')+'</div>'}).join('');
return `<h1>Ders Kayıt</h1><div class="strip"><span>Toplam <b class="${t>l?'bad':''}">${t}</b> / ${l} AKTS</span><span>Şube seçilen: ${pk.length}/${S.want.size}</span><button id="sug">Otomatik program önerisi</button><button id="fin" class="s">Kaydı tamamla</button></div>
<div class="two"><div>${rows||'<p class="mu">Ders bulunamadı. Veri ve Kurallar sayfasını kontrol et.</p>'}</div><div class="sticky">${grid(pk)}</div></div>`}

function prog(){const pk=picked();return `<h1>Haftalık Program</h1>${grid(pk)}<h2>Seçilen dersler</h2><table class="lt"><tr><th>Şube</th><th>Kod</th><th>Ders</th><th>Tür</th><th>AKTS</th><th>Saatler</th></tr>${pk.map(({c,s})=>`<tr><td>${esc(s.n)}</td><td>${esc(c.kod)}</td><td>${esc(c.ad)}</td><td>${c.tur}</td><td>${c.akts}</td><td>${lbl(s)}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Henüz şube seçilmedi.</td></tr>'}</table><button class="s" onclick="print()">Yazdır</button>`}

function stat(){return `<h1>Durumum</h1><div class="card"><div class="row"><label>AGNO <input id="gno" type="number" step="0.01" value="${S.gno}"></label><label>Başarılan AKTS <input id="ap" type="number" value="${S.ap}"></label><label>Toplam AKTS <input id="at" type="number" value="${S.at}"></label></div><label>Geçilen dersler<textarea id="passed">${esc(S.passed)}</textarea></label><label>Kalınan dersler <input id="failed" value="${esc(S.failed)}"></label><p class="mu">Müfredat Durum ekranından ders kodlarını kopyala, virgülle ayır. Değişiklik alandan çıkınca uygulanır.</p></div>`}

function data(){return `<h1>Veri ve Kurallar</h1><div class="card"><h3>Ders ve şube verisi</h3><p class="mu">Satır biçimi: kod;ad;AKTS;tür (Z/S);şube;zamanlar;önkoşullar · Zamanlar: Pzt 08:40-10:30|Çar 10:40-11:30 · Önkoşullar: KOD1+KOD2</p><textarea id="csv">${esc(S.csv)}</textarea><div class="row"><input type="file" id="file" accept=".csv,.txt"><button class="s" id="rst">Güz 2026-27 verisini geri yükle</button></div></div>
<div class="card" style="margin-top:12px"><h3>Kurallar</h3><div class="row"><label>AGNO eşiği <input id="thr" type="number" step="0.01" value="${S.thr}"></label><label>Eşik ve üstü AKTS sınırı <input id="hi" type="number" value="${S.hi}"></label><label>Eşiğin altı AKTS sınırı <input id="lo" type="number" value="${S.lo}"></label></div><p class="mu">Varsayılan değerler yönetmelikten doğrulanmamıştır; kendi yönetmeliğine göre düzelt.</p></div>
<div class="card" style="margin-top:12px"><h3>Kaynaklar</h3><p class="mu">Şube saatleri: OBS “2026-2027 Güz Ders Programı” PDF’leri. Ders adı ve AKTS: Enerji Sistemleri Mühendisliği Bologna müfredatı. Önkoşul verisi henüz yok.</p></div>`}

const PAGES={home:'Ana Sayfa',reg:'Ders Kayıt',prog:'Haftalık Program',stat:'Durumum',data:'Veri ve Kurallar'},V={home,reg,prog,stat,data};
function chrome(){const L=S.lang;
$('side').innerHTML=tr(`<div class="brand"><img src="@@LOGO@@" alt=""><div><b>Öğrenci Bilgi Sistemi+</b><small>Yaşar Üniversitesi · Kayıt Planlayıcı</small></div></div><nav id="menu">${Object.entries(PAGES).map(([k,v])=>`<button class="m ${S.page===k?'on':''}" data-go="${k}">${v}</button>`).join('')}</nav><p class="note">Resmî OBS değildir. Veriler yalnızca tarayıcında işlenir, hiçbir yere gönderilmez. Gerçek kayıt OBS’de yapılır.</p>`).replace('@@LOGO@@',LOGO);
$('hdr').innerHTML=tr(`<span class="chip">2026-2027 Güz</span><div class="row2"><span class="lang"><button data-lang="tr" class="${L==='tr'?'on':''}">TR</button><button data-lang="en" class="${L==='en'?'on':''}">EN</button></span><div class="who">Demo Öğrenci<small>Öğrenci No: 21070008002</small></div></div>`)}
function show(){chrome();$('view').innerHTML=tr(V[S.page]());document.documentElement.lang=S.lang}
const keep=()=>{const y=scrollY;show();scrollTo(0,y)};
const open=h=>{$('mbox').innerHTML=tr(h+'<div class="row"><button id="cls" class="s">Kapat</button></div>');$('modal').hidden=false};

function suggest(){if(!S.want.size)return open('<p>Önce en az bir ders seç.</p>');
open(`<h2>Otomatik program önerisi</h2><p class="mu">Seçili ${S.want.size} dersin tüm şube kombinasyonları denenir, çakışanlar elenir.</p><div class="row"><label><input type="checkbox" id="p1" ${S.pref.days?'checked':''}> Az gün</label><label><input type="checkbox" id="p2" ${S.pref.gaps?'checked':''}> Az boşluk</label><label><input type="checkbox" id="p3" ${S.pref.early?'checked':''}> 10:40’tan önce ders olmasın</label><button id="go">Hesapla</button></div><div id="res"></div>`)}
function run(){S.pref={days:+$('p1').checked,gaps:+$('p2').checked,early:+$('p3').checked};
const ch=chosen(),R=solve(ch);let h='';
if(!R.length){const pr=[];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++)if(ch[i].sec.every(x=>ch[j].sec.every(y=>clash(x,y))))pr.push(ch[i].kod+' ve '+ch[j].kod);
h=`<p class="bad"><b>Çakışmasız program yok.</b> ${pr.length?'Her şube kombinasyonunda çakışanlar: '+esc(pr.join('; '))+'. Birini bırakmayı düşün.':'Çakışma üç veya daha fazla dersin birleşiminden geliyor; bir dersi çıkarıp tekrar dene.'}</p>`}
else{R.sort((a,b)=>score(a)-score(b));S.plans=R.slice(0,3);
h=`<p class="mu">${R.length>=3000?'3000’den fazla':R.length} çakışmasız program bulundu. En iyi üçü:</p><div class="plans">${S.plans.map((p,i)=>`<div class="card"><h3>Plan ${'ABC'[i]}</h3>${grid(p)}<p class="mu small">${p.map(t=>esc(t.c.kod)+' şube '+esc(t.s.n)).join(' · ')}</p><button data-ap="${i}">Bu planı uygula</button></div>`).join('')}</div>`}
$('res').innerHTML=tr(h)}
function finish(){const pk=picked(),t=tot(),l=lim(),ch=chosen(),nop=ch.filter(c=>!S.pick[c.kod]),mf=[...F()].filter(k=>C[k]&&!S.want.has(k));
const cl=pk.some((a,i)=>pk.some((b,j)=>j>i&&clash(a.s,b.s)));
const r=[[t>0,'En az bir ders seçili'],[!nop.length,'Her seçili ders için şube seçildi'+(nop.length?' (eksik: '+esc(nop.map(c=>c.kod).join(', '))+')':'')],[!cl,'Ders saatleri çakışmıyor'],[t<=l,`AKTS sınırı: ${t} / ${l}`],[ch.every(c=>!miss(c).length),'Önkoşullar sağlanıyor'],[!mf.length,'Kalınan dersler listede'+(mf.length?' (eksik: '+esc(mf.join(', '))+')':'')]];
open(`<h2>Göndermeden önce kontrol</h2>${r.map(([b,x])=>`<div class="${b?'ok':'bad'}">${b?'✓':'✗'} ${x}</div>`).join('')}<table class="lt"><tr><th>Şube</th><th>Kod</th><th>Ders</th><th>AKTS</th></tr>${pk.map(({c,s})=>`<tr><td>${esc(s.n)}</td><td>${esc(c.kod)}</td><td>${esc(c.ad)}</td><td>${c.akts}</td></tr>`).join('')}</table>${r.every(x=>x[0])?'<p class="ok"><b>Her şey tamam.</b> Şimdi gerçek kaydı OBS’de yap.</p>':'<p class="mu">Kırmızı maddeleri düzelt.</p>'}<p class="mu small">Bu araç hiçbir şey göndermez. Kurallar senin girdiğin değerlere göre çalışır.</p>`)}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.lang){S.lang=t.dataset.lang;show();return}
if(t.dataset.go){S.page=t.dataset.go;show();scrollTo(0,0);return}
if(t.dataset.s!==undefined){const k=t.dataset.c;S.pick[k]=S.pick[k]===t.dataset.s?undefined:t.dataset.s;keep();return}
if(t.dataset.ap!==undefined){S.plans[+t.dataset.ap].forEach(({c,s})=>{S.pick[c.kod]=s.n});$('modal').hidden=true;S.page='reg';show();return}
const f={sug:suggest,fin:finish,go:run,rst:()=>{S.csv=CSV;reset();show()},cls:()=>{$('modal').hidden=true}}[t.id];if(f)f()});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.c&&t.type==='checkbox'){if(t.checked)S.want.add(t.dataset.c);else{S.want.delete(t.dataset.c);delete S.pick[t.dataset.c]}keep();return}
if(t.id==='file'&&t.files[0]){t.files[0].text().then(x=>{S.csv=x;reset();show()});return}
if(t.id==='csv'){S.csv=t.value;reset();show();return}
if(['gno','ap','at','thr','hi','lo'].includes(t.id)){S[t.id]=+t.value;show();return}
if(t.id==='passed'||t.id==='failed'){S[t.id]=t.value;reset();show()}});
reset();show();
</script>
</body>
</html>
