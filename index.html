<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Öğrenci Bilgi Sistemi+ · Yaşar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f4f5f5;--card:#fff;--tx:#1e2a38;--mu:#5c6f82;--ac:#1e2a38;--gold:#c9a86a;--nav:#1e2a38;--bd:#e7e9ea;--bad:#b3261e;--ok:#167649}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.app>div{background:#fff}
.nav{background:var(--nav);color:#dbe6f3;padding:16px 12px;display:flex;flex-direction:column;gap:12px}
.brand b{display:block;font-size:16px;color:#fff}.brand small{color:var(--gold)}
#menu{display:flex;flex-direction:column;gap:2px}
.m{text-align:left;background:none;border:0;color:#cfdcec;padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer}
.m.on,.m:hover{background:#323d4a;color:#fff}.m.on{box-shadow:inset 3px 0 var(--gold)}
.note{font-size:12px;color:#8fa6c0;margin-top:auto}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 20px;background:var(--nav);color:#fff;border-bottom:2px solid var(--gold)}
.chip{background:#323d4a;border-radius:6px;padding:2px 8px;font-size:12px}
main{padding:20px;max-width:1100px}
.brand{display:flex;gap:10px;align-items:center}.brand img{width:54px;height:54px;border-radius:50%;background:#fff}.brand b{font-size:15px}
.row2{display:flex;gap:14px;align-items:center}.lang{display:flex;gap:4px}
.lang button{background:transparent;color:#cfdcec;border:1px solid #4a5666;padding:3px 10px;font-size:12px}.lang button.on{background:var(--gold);color:#1e2a38;border-color:var(--gold)}
.grp{color:var(--gold);font-size:12px;letter-spacing:.14em;margin:14px 12px 4px}
.m.sub{padding:6px 12px 6px 24px;font-size:13px;width:100%}.m.off{opacity:.4;cursor:not-allowed}
.hc{display:flex;gap:12px}.hc p{margin:2px 0;font-size:13px;letter-spacing:.04em}
.ic{width:40px;height:40px;border-radius:10px;background:#eef1f8;color:#1e2a38;display:flex;align-items:center;justify-content:center;flex:none}
.banner{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 16px}
.who{text-align:right;line-height:1.3}.who small{display:block;color:#a9b8c9;font-size:12px;font-weight:400}
h1{font-size:24px;margin:0 0 12px}h2{font-size:17px;margin:20px 0 8px}h3{font-size:12px;margin:0 0 6px;color:var(--mu);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:linear-gradient(90deg,#d5d8fb,#f3dec5) top/100% 3px no-repeat,var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 14px 14px;box-shadow:0 2px 8px #1e2a3814}
.big{font-size:30px;font-weight:600}.big small{font-size:15px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.tag{background:#f5e3a8;color:#5a4300;border-radius:4px;padding:1px 8px;font-size:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;font:inherit;color:var(--tx);cursor:pointer}
.tile b{display:block}.tile span{color:var(--mu);font-size:13px}
.banner{background:#167649;color:#fff;border-radius:6px;padding:8px 12px;margin-bottom:12px}
.strip{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.sticky{position:sticky;top:12px}
.course{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.course.on{border-left:3px solid var(--gold)}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:12px/1.3 inherit;cursor:pointer;text-align:left}
.sec.sel{background:var(--ac);color:var(--card);border-color:var(--ac)}
.sec:disabled{opacity:.45;cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 4px,var(--bd) 4px,var(--bd) 8px)}
table{border-collapse:collapse;width:100%}
.tt{font-size:11px;table-layout:fixed}.tt td,.tt th{border:1px solid var(--bd);height:19px;padding:0 2px;text-align:center;overflow:hidden;white-space:nowrap;color:#fff}
.tt th{background:var(--bg);color:var(--tx);font-weight:600}
.lt{font-size:13px;margin:8px 0}.lt th,.lt td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
button{font:inherit;font-weight:600;background:var(--ac);color:var(--card);border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea,input:not([type=checkbox]):not([type=file]){font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
textarea{width:100%;height:150px;font:12px/1.45 ui-monospace,monospace}
label{display:block}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mu{color:var(--mu)}.small{font-size:12px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal[hidden]{display:none}
.box{background:var(--card);border-radius:10px;padding:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:800px){.app{grid-template-columns:1fr}#menu{flex-direction:row;flex-wrap:wrap}.note{display:none}.two{grid-template-columns:1fr}}
@media print{.nav,header,button,.strip{display:none}.app{display:block}}
</style>
</head>

<div class="card" style="margin-top:12px"><h3>Kurallar</h3><div class="row"><label>AGNO eşiği <input id="thr" type="number" step="0.01" value="${S.thr}"></label><label>Eşik ve üstü AKTS sınırı <input id="hi" type="number" value="${S.hi}"></label><label>Eşiğin altı AKTS sınırı <input id="lo" type="number" value="${S.lo}"></label></div><label><input type="checkbox" id="grad" ${S.grad?'checked':''}> Mezuniyet durumundayım (asgari 20 AKTS aranmaz)</label><p class="mu">Varsayılan sınırlar Yönetmelik Md. 22–24’e göredir (başarılı: 40, sınamalı: 32 AKTS). Sonraki değişiklikleri kontrol et.</p></div>
<div class="card" style="margin-top:12px"><h3>Kaynaklar</h3><p class="mu">Şube saatleri: OBS “2026-2027 Güz Ders Programı” PDF’leri. Ders adı ve AKTS: Enerji Sistemleri Mühendisliği Bologna müfredatı. Önkoşul verisi henüz yok.</p></div>`}

const RL=[["Md. 16, 18", "Dönem ücreti ödenmeden dönem kaydı ve ders kaydı yapılmaz. Kayıt yenileme ve ders kaydı akademik takvimdeki sürelerde yapılır; tam burslu öğrenciler de bu işlemleri yapmak zorundadır.", "Term fees must be paid before registration. Renewal and course registration take place within the academic calendar dates; fully scholarship students must register too.", 0], ["Md. 19", "Kayıt yenileme, bireysel ders programı oluşturma ve ders alma-bırakma danışmanın rehberliğinde yapılır. Kayıt işlemlerindeki hata ve eksiklerden öğrenci sorumludur.", "Registration renewal, building your schedule and add/drop are done under your advisor’s guidance. You are responsible for errors or omissions in your registration.", 1], ["Md. 22", "Bir dönemde en az 20, en fazla 40 kredi (AKTS) alınabilir. Mezuniyet durumundaki veya lisansı sekiz dönemde bitiremeyen öğrenciye asgari kredi şartı aranmaz. Başarılı/sınamalı statüleri yeni başlayanlar için ikinci dönem sonundan itibaren uygulanır.", "A term load is at least 20 and at most 40 credits (ECTS). The minimum does not apply to students in graduation status or who cannot finish in eight terms. Successful/probationary status applies to new students after the second term.", 1], ["Md. 23", "Genel not ortalaması en az 2,00 olan “başarılı” öğrenci bir dönemde en fazla 40 AKTS’lik derse kayıt yaptırabilir.", "A “successful” student (CGPA at least 2.00) may register for at most 40 ECTS per term.", 1], ["Md. 24", "GNO 1,99 veya altındaysa öğrenci “sınamalı”dır: önce başarısız olduğu (F, W, U, NA) zorunlu dersleri tekrar eder ve en fazla 32 AKTS alır. Tekrar edilecek yeterli ders yoksa 32 AKTS’ye kadar yeni ders alabilir.", "With a CGPA of 1.99 or below the student is “probationary”: required courses failed (F, W, U, NA) are retaken first, with at most 32 ECTS. If there are not enough courses to retake, new courses up to 32 ECTS are allowed.", 1], ["Md. 25", "Seçimli dersler ekle-bırak süresinde danışman rehberliğinde değiştirilebilir ve bırakılabilir. Zorunlu ders ancak başka bir zorunlu ders alınırsa bırakılabilir. Ekle-bırak bittikten sonra ders kaydı yapılmaz; kayıtlı olmadığın derse devam sayılmaz.", "Elective courses can be changed or dropped during add/drop with your advisor. A required course can be dropped only if another required course is taken. No registration is possible after add/drop ends, and attending an unregistered course does not count.", 1], ["Md. 26", "Zorunlu bir dersten F, U, W veya NA alan öğrenci o dersi açıldığı ilk dönemde öncelikle alır. Başarılı öğrenci C-, D+ ve D’yi ekle-bırakta yer varsa tekrarlayabilir. Başarısız seçmeli ders tekrarlanır ya da aynı gruptan başka seçmeli alınır.", "A required course failed with F, U, W or NA must be retaken first in the next term it is offered. A successful student may retake C-, D+ and D during add/drop if there is room. A failed elective is retaken or replaced by another from the same group.", 1], ["Md. 28", "Önkoşullu derslerin alınabilmesi için önceki derslerin başarılması gerekir. Eş koşullu dersler blok halinde eklenir ve bırakılır.", "Prerequisite courses require passing earlier courses. Co-requisite courses are added and dropped together as a block.", 1], ["Md. 29", "İlk kez alınan derslerin programları çakışamaz. F veya U’lu bir dersin saati yeni derslerle çakışırsa o derse yine kayıt yapılabilir (devam aranmaz; sınav ve ödevler zorunlu).", "Schedules of courses taken for the first time cannot clash. A course with an F or U may still be registered if it clashes with new courses (attendance not required; exams and assignments are).", 1], ["Md. 21, 30", "Not ortalaması AKTS ağırlıklıdır; virgülden sonra iki hane gösterilir, üçüncü hane dikkate alınmaz. Tekrarlanan derste son not geçerlidir. Katsayılar: A 4,00; A- 3,70; B+ 3,30; B 3,00; B- 2,70; C+ 2,30; C 2,00; C- 1,70; D+ 1,30; D 1,00; F 0. T (transfer) notu ortalamaya katılmaz.", "Averages are weighted by ECTS and shown with two decimals; the third decimal is dropped. The latest grade counts for repeated courses. Coefficients: A 4.00; A- 3.70; B+ 3.30; B 3.00; B- 2.70; C+ 2.30; C 2.00; C- 1.70; D+ 1.30; D 1.00; F 0. T (transfer) grades are not counted.", 1], ["Md. 7", "Normal öğretim süresi lisansta dört, azami süre yedi yıldır.", "The normal duration is four years for a bachelor’s degree, the maximum is seven.", 0], ["Yaz okulu", "Yaz okulunda en fazla 15 AKTS alınabilir; program çakışırsa kayıt yapılmaz ve kesin kayıttan sonra ders değiştirilemez (Öğrenci İşleri sayfası, 2025-2026).", "Summer school allows at most 15 ECTS; clashing schedules cannot be registered and courses cannot be changed after final registration (Student Affairs page, 2025-2026).", 0]];
function yon(){const en=S.lang==='en',a=(h,x,y)=>`<li><a href="${h}" target="_blank" rel="noopener">${en?y:x}</a></li>`;
return `<h1>Yönetmelik ve Kaynaklar</h1><p class="mu">${en?'Summary of the course-registration articles of the Yaşar University Undergraduate and Associate Degree Education and Examination Regulation (Official Gazette, 22 Feb 2021, no. 31403). The official text prevails; check for later amendments.':'Yaşar Üniversitesi Ön Lisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği’nin (Resmî Gazete, 22 Şubat 2021, sayı 31403) ders kaydıyla ilgili maddelerinin özetidir. Resmî metin esastır; sonraki değişiklikleri kontrol et.'}</p>
<table class="lt"><tr><th>${en?'Article':'Madde'}</th><th>${en?'Rule':'Kural'}</th><th>${en?'In planner':'Planlayıcıda'}</th></tr>${RL.map(r=>`<tr><td>${r[0]}</td><td>${en?r[2]:r[1]}</td><td>${r[3]?'✓':''}</td></tr>`).join('')}</table>
<h2>${en?'Sources':'Kaynaklar'}</h2><ul>${a('https://www.yasar.edu.tr/yu-files/yonetmelik-yonerge/tr/59751247618113477416.pdf','Yaşar Üniversitesi Eğitim-Öğretim ve Sınav Yönetmeliği (PDF)','Yaşar University Education and Examination Regulation (PDF)')}${a('https://oim.yasar.edu.tr/onlisans-lisans/','Öğrenci İşleri: Ön lisans ve lisans ders kaydı bilgileri','Student Affairs: undergraduate course registration information')}${a('https://oim.yasar.edu.tr/yaz-okulu/','Öğrenci İşleri: Yaz okulu','Student Affairs: summer school')}${a('https://oim.yasar.edu.tr/','Öğrenci İşleri: akademik takvim ve duyurular','Student Affairs: academic calendar and announcements')}${a('https://www.mevzuat.gov.tr','Mevzuat Bilgi Sistemi (güncel metin ve değişiklikler)','Legislation Information System (current text and amendments)')}</ul>
<p class="mu small">${en?'The older 2012 regulation was repealed (Art. 39); do not rely on it. Dates of the 2026-2027 academic calendar are not included here; see Student Affairs.':'2012 tarihli eski yönetmelik yürürlükten kalkmıştır (Md. 39); onu kaynak alma. 2026-2027 akademik takvim tarihleri burada yer almıyor; Öğrenci İşleri sayfasına bak.'}</p>`}
const MG=[['Ders ve Dönem İşlemleri',[['reg','Ders Kayıt'],['adb','Ders Ekle/Bırak'],['avg','Dönem Ortalamaları'],[0,'Not Listesi'],['trn','Transkript'],[0,'Transkript Senaryosu'],[0,'Diğer Belgeler'],['mdur','Müfredat Durum'],['mpak','Müfredat Bilgi Paketi'],[0,'Devamsızlık Durumu']]],['Planlayıcı',[['prog','Haftalık Program'],['stat','Durumum'],['yon','Yönetmelik ve Kaynaklar'],['data','Veri ve Kurallar']]]];
const menu=()=>`<button class="m ${S.page==='home'?'on':''}" data-go="home">Ana Sayfa</button>`+MG.map(([g,it])=>`<div class="grp">${g}</div>`+it.map(([k,v])=>k?`<button class="m sub ${S.page===k?'on':''}" data-go="${k}">${v}</button>`:`<button class="m sub off" disabled title="Bu projede kullanılmıyor">${v}</button>`).join('')).join('');
const V={home,reg,prog,stat,data,yon,adb,avg,trn,mdur:()=>semT(0),mpak:()=>semT(1)};
function chrome(){const L=S.lang;
$('side').innerHTML=tr(`<div class="brand"><img src="@@LOGO@@" alt=""><div><b>Öğrenci Bilgi Sistemi+</b><small>Yaşar Üniversitesi</small></div></div><nav id="menu">${menu()}</nav><p class="note">Resmî OBS değildir. Veriler yalnızca tarayıcında işlenir, hiçbir yere gönderilmez. Gerçek kayıt OBS’de yapılır.</p>`).replace('@@LOGO@@',LOGO);
$('hdr').innerHTML=tr(`<span class="chip">2026-2027 Güz</span><div class="row2"><span class="lang"><button data-lang="tr" class="${L==='tr'?'on':''}">TR</button><button data-lang="en" class="${L==='en'?'on':''}">EN</button></span><div class="who">Demo Öğrenci<small>Öğrenci No: 21070008002</small></div></div>`)}
function show(){chrome();$('view').innerHTML=tr(V[S.page]());document.documentElement.lang=S.lang}
const keep=()=>{const y=scrollY;show();scrollTo(0,y)};
const open=h=>{$('mbox').innerHTML=tr(h+'<div class="row"><button id="cls" class="s">Kapat</button></div>');$('modal').hidden=false};

function suggest(){if(!S.want.size)return open('<p>Önce en az bir ders seç.</p>');
open(`<h2>Otomatik program önerisi</h2><p class="mu">Seçili ${S.want.size} dersin tüm şube kombinasyonları denenir, çakışanlar elenir.</p><div class="row"><label><input type="checkbox" id="p1" ${S.pref.days?'checked':''}> Az gün</label><label><input type="checkbox" id="p2" ${S.pref.gaps?'checked':''}> Az boşluk</label><label><input type="checkbox" id="p3" ${S.pref.early?'checked':''}> 10:40’tan önce ders olmasın</label><button id="go">Hesapla</button></div><div id="res"></div>`)}
function run(){S.pref={days:+$('p1').checked,gaps:+$('p2').checked,early:+$('p3').checked};
const ch=chosen(),R=solve(ch);let h='';
if(!R.length){const pr=[];for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++)if(ch[i].sec.every(x=>ch[j].sec.every(y=>clash(x,y))))pr.push(ch[i].kod+' ve '+ch[j].kod);
h=`<p class="bad"><b>Çakışmasız program yok.</b> ${pr.length?'Her şube kombinasyonunda çakışanlar: '+esc(pr.join('; '))+'. Birini bırakmayı düşün.':'Çakışma üç veya daha fazla dersin birleşiminden geliyor; bir dersi çıkarıp tekrar dene.'}</p>`}
else{R.sort((a,b)=>score(a)-score(b));S.plans=R.slice(0,3);
h=`<p class="mu">${R.length>=3000?'3000’den fazla':R.length} çakışmasız program bulundu. En iyi üçü:</p><div class="plans">${S.plans.map((p,i)=>`<div class="card"><h3>Plan ${'ABC'[i]}</h3>${grid(p)}<p class="mu small">${p.map(t=>esc(t.c.kod)+' şube '+esc(t.s.n)).join(' · ')}</p><button data-ap="${i}">Bu planı uygula</button></div>`).join('')}</div>`}
$('res').innerHTML=tr(h)}
function finish(){const pk=picked(),t=tot(),l=lim(),ch=chosen(),nop=ch.filter(c=>!S.pick[c.kod]),mf=[...F()].filter(k=>C[k]&&!S.want.has(k));
const cl=pk.some((a,i)=>pk.some((b,j)=>j>i&&clash(a.s,b.s)));
const r=[[t>0,'En az bir ders seçili'],[!nop.length,'Her seçili ders için şube seçildi'+(nop.length?' (eksik: '+esc(nop.map(c=>c.kod).join(', '))+')':'')],[!cl,'Ders saatleri çakışmıyor (Md. 29)'],[t<=l,`AKTS sınırı: ${t} / ${l} (Md. 22–24)`],[t>=20||S.grad,'En az 20 AKTS (Md. 22)'],[ch.every(c=>!miss(c).length),'Önkoşullar sağlanıyor (Md. 28)'],[!mf.length,'Kalınan dersler listede (Md. 26)'+(mf.length?' (eksik: '+esc(mf.join(', '))+')':'')]];
open(`<h2>Göndermeden önce kontrol</h2>${r.map(([b,x])=>`<div class="${b?'ok':'bad'}">${b?'✓':'✗'} ${x}</div>`).join('')}<table class="lt"><tr><th>Şube</th><th>Kod</th><th>Ders</th><th>AKTS</th></tr>${pk.map(({c,s})=>`<tr><td>${esc(s.n)}</td><td>${esc(c.kod)}</td><td>${esc(c.ad)}</td><td>${c.akts}</td></tr>`).join('')}</table>${r.every(x=>x[0])?'<p class="ok"><b>Her şey tamam.</b> Şimdi gerçek kaydı OBS’de yap.</p>':'<p class="mu">Kırmızı maddeleri düzelt.</p>'}<p class="mu small">Bu araç hiçbir şey göndermez. Kurallar senin girdiğin değerlere göre çalışır.</p>`)}

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.lang){S.lang=t.dataset.lang;show();return}
if(t.dataset.go){S.page=t.dataset.go;show();scrollTo(0,0);return}
if(t.dataset.s!==undefined){const k=t.dataset.c;S.pick[k]=S.pick[k]===t.dataset.s?undefined:t.dataset.s;keep();return}
if(t.dataset.ap!==undefined){S.plans[+t.dataset.ap].forEach(({c,s})=>{S.pick[c.kod]=s.n});$('modal').hidden=true;S.page='reg';show();return}
const f={sug:suggest,fin:finish,go:run,rst:()=>{S.csv=CSV;reset();show()},cls:()=>{$('modal').hidden=true}}[t.id];if(f)f()});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.d!==undefined){t.checked?S.drop.add(t.dataset.d):S.drop.delete(t.dataset.d);keep();return}
if(t.dataset.c&&t.type==='checkbox'){if(t.checked)S.want.add(t.dataset.c);else{S.want.delete(t.dataset.c);delete S.pick[t.dataset.c]}keep();return}
if(t.id==='file'&&t.files[0]){t.files[0].text().then(x=>{S.csv=x;reset();show()});return}
if(t.id==='grad'){S.grad=t.checked;show();return}
if(t.id==='csv'){S.csv=t.value;reset();show();return}
if(['gno','ap','at','thr','hi','lo'].includes(t.id)){S[t.id]=+t.value;show();return}
if(t.id==='passed'||t.id==='failed'){S[t.id]=t.value;reset();show()}});
reset();show();
</script>
</body>
</html>
